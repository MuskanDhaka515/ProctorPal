name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proctorpal:${{ github.sha }} .

    deploy:
    # EC2 deployment is intentionally disabled until a production
    # environment and repository secrets are configured.
    needs: docker-build
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deployment not configured yet."